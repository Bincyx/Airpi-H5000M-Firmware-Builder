name: Build H5000M firmware

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore existing build cache
        required: false
        type: boolean
        default: false
  schedule:
    # Check the selected upstream branch daily at 04:00 Asia/Taipei.
    - cron: '0 20 * * *'

concurrency:
  group: h5000m-firmware
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: https://github.com/padavanonly/immortalwrt-mt798x-24.10.git
  SOURCE_BRANCH: mt798x-mt799x-6.6-mtwifi

jobs:
  check-upstream:
    name: Check upstream revision
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      source_commit: ${{ steps.check.outputs.source_commit }}

    steps:
      - name: Compare upstream with successful releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(git ls-remote "$SOURCE_REPOSITORY" "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test -n "$source_sha"
          source_commit="${source_sha:0:12}"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '.[].tagName' | grep -Fq -- "-$source_commit"; then
            echo "Upstream $source_commit already has a successful release."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream $source_commit has no successful release yet."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Hiveton H5000M
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: 

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - name: Install build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dos2unix python3-netifaces libfuse-dev
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Clone upstream source
        run: |
          git clone -q --depth 1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPOSITORY" .work/source
          echo "SOURCE_COMMIT=$(git -C .work/source rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Restore download and build caches
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@v4
        with:
          path: |
            .work/source/dl
            .work/source/.ccache
          key: h5000m-v2-${{ runner.os }}-${{ env.SOURCE_BRANCH }}-${{ env.SOURCE_COMMIT }}-${{ hashFiles('config/**', 'scripts/**', 'overlay/**') }}
          restore-keys: |
            h5000m-v2-${{ runner.os }}-${{ env.SOURCE_BRANCH }}-

      - name: Prepare firmware configuration
        run: bash ./scripts/prepare.sh .work/source

      - name: Download package sources
        working-directory: .work/source
        run: |
          echo "::group::Downloading package sources"
          make download -j"$(nproc)" >/dev/null 2>&1 || make download -j"$(nproc)"
          echo "::endgroup::"

      - name: Build firmware
        working-directory: .work/source
        run: |
          echo "Building firmware... (Logs are being buffered to avoid log truncation)"
          make -j"$(nproc)" > build.log 2>&1 || {
            echo "=== Build Failed! Showing last 200 lines of log ==="
            tail -n 200 build.log
            exit 1
          }

      - name: Collect firmware and checksums
        run: bash ./scripts/collect.sh .work/source .work/release

      - name: Upload build artifacts
        uses: 
        with:
          name: H5000M-zh-tw-${{ env.SOURCE_COMMIT }}
          path: .work/release/
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="h5000m-$(date -u +'%Y%m%d-%H%M')-${SOURCE_COMMIT}"
          gh release create "$tag" .work/release/* \
            --title "H5000M firmware $(date -u +'%Y-%m-%d')" \
            --notes "Hiveton / AirPi H5000M firmware with Traditional Chinese LuCI. Upstream commit: ${SOURCE_COMMIT}. Verify SHA256 checksums and back up the factory firmware and configuration before flashing."
