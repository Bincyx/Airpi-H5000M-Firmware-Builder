name: Build H5000M firmware

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Ignore existing build cache
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 20 * * 0'

concurrency:
  group: h5000m-firmware
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_BRANCH: mt798x-mt799x-6.6-mtwifi

jobs:
  build:
    name: Hiveton H5000M
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - name: Install build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dos2unix python3-netifaces libfuse-dev
          sudo bash -c 'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Clone upstream source
        run: |
          git clone --depth 1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPOSITORY" .work/source
          echo "SOURCE_COMMIT=$(git -C .work/source rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Restore download and build caches
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@v4
        with:
          path: |
            .work/source/dl
            .work/source/.ccache
            .work/source/staging_dir/host*
            .work/source/staging_dir/tool*
          key: h5000m-${{ runner.os }}-${{ env.SOURCE_BRANCH }}-${{ env.SOURCE_COMMIT }}-${{ hashFiles('config/**', 'scripts/**', 'overlay/**') }}
          restore-keys: |
            h5000m-${{ runner.os }}-${{ env.SOURCE_BRANCH }}-

      - name: Prepare firmware configuration
        run: bash ./scripts/prepare.sh .work/source

      - name: Download package sources
        working-directory: .work/source
        run: make download -j"$(nproc)"

      - name: Build firmware
        working-directory: .work/source
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware and checksums
        run: bash ./scripts/collect.sh .work/source .work/release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H5000M-zh-tw-${{ env.SOURCE_COMMIT }}
          path: .work/release/
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="h5000m-$(date -u +'%Y%m%d-%H%M')-${SOURCE_COMMIT}"
          gh release create "$tag" .work/release/* \
            --title "H5000M firmware $(date -u +'%Y-%m-%d')" \
            --notes "Hiveton / AirPi H5000M firmware with Traditional Chinese LuCI. Upstream commit: ${SOURCE_COMMIT}. Verify SHA256 checksums and back up the factory firmware and configuration before flashing."

